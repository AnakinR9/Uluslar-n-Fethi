name: APK ve Windows Kurulum Derle
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Windows kurulum dosyasını derle
        shell: bash
        run: |
          mkdir -p windows/app
          cp www/index.html windows/app/index.html
          cd windows
          npm install
          npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Kurulum
          path: windows/dist/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: APK derle
        run: |
          cd android
          mkdir -p www assets
          cp ../www/index.html www/index.html
          cp ../icon.png assets/icon-only.png
          cp ../icon.png assets/icon-foreground.png
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#050b14' --iconBackgroundColorDark '#050b14' || true
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/android:configChanges=/android:screenOrientation="sensorLandscape" android:configChanges=/' android/app/src/main/AndroidManifest.xml || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
